                                                                div className = "absolute w-10 h-5 bg-yellow-400 rounded-full bottom-0"
                                                                style = { { borderRadius: '0 0 20px 20px' } } > < /div> <
                                                                /div> <
                                                                div className = "text-red-500" > < Icon name = "book"
                                                                size = { 32 }
                                                                /></div >
                                                                <
                                                                /div> <
                                                                div className = "text-center px-4 mb-4" >
                                                                <
                                                                h3 className = "text-[11px] font-black text-red-500" >
                                                                KEMENTERIAN SOSIAL REPUBLIK INDONESIA < /h3> <
                                                                h4 className = "text-[13px] font-bold text-white mt-1" >
                                                                Sekolah Rakyat Terintegrasi 39 Garut < /h4> <
                                                                /div> <
                                                                div className = "bg-yellow-500 text-[#0f3a58] text-center py-1 mb-4" >
                                                                <
                                                                h2 className = "text-sm font-black tracking-widest" >
                                                                KARTU PELAJAR SISWA < /h2> <
                                                                /div> <
                                                                div className = "px-4 flex gap-3 h-[180px]" >
                                                                <
                                                                div className = "w-[90px] h-[120px] bg-blue-100 rounded-md flex flex-col items-center justify-center" >
                                                                <
                                                                div className = "w-8 h-8 bg-white rounded-full mb-1" > < /div> <
                                                                div className = "w-14 h-10 bg-white rounded-t-xl" > < /div> <
                                                                /div> <
                                                                div className = "flex-1 text-[10px] text-white space-y-1.5 pt-1" >
                                                                <
                                                                div >
                                                                <
                                                                span className = "block text-gray-300" > Nama: < /span> <
                                                                span className = "font-bold" > { studentData.nama } < /span> <
                                                                /div> <
                                                                div >
                                                                <
                                                                span className = "block text-gray-300" > NISN: < /span> <
                                                                span className = "font-bold" > { studentData.nisn } < /span> <
                                                                /div> <
                                                                div >
                                                                <
                                                                span className = "block text-gray-300" > Kelas: < /span> <
                                                                span className = "font-bold" > { studentData.kelas } < /span> <
                                                                /div> <
                                                                /div> <
                                                                /div> <
                                                                div className = "absolute bottom-4 right-4 bg-white p-1 rounded" >
                                                                <
                                                                img src = { qrUrl }
                                                                alt = "QR Code"
                                                                className = "w-[70px] h-[70px]"
                                                                crossOrigin = "anonymous" />
                                                                <
                                                                /div> <
                                                                /div> <
                                                                /div>
                                                            );
                                                        };

                                                        // ============================================================
                                                        //  DASHBOARD
                                                        // ============================================================
                                                        const Dashboard = ({ user, onLogout }) => {
                                                            const isTeacher = user.role === 'teacher';
                                                            const [activeMenu, setActiveMenu] = useState(isTeacher ? 'attendance' :
                                                                'materials');
                                                            const [students, setStudents] = useState(defaultStudents);
                                                            const [materials, setMaterials] = useState(defaultMaterials);
                                                            const [agendas, setAgendas] = useState(defaultAgendas);

                                                            const menus = isTeacher ? [
                                                                { id: 'attendance', label: 'Kehadiran Murid',
                                                                    icon: 'fileText' },
                                                                { id: 'scanner', label: 'Scan Presensi', icon: 'qrcode' },
                                                                { id: 'materials', label: 'Materi Ajar', icon: 'book' },
                                                                { id: 'agenda', label: 'Agenda Guru', icon: 'calendar' },
                                                            ] : [
                                                                { id: 'materials', label: 'Materi Pembelajaran',
                                                                    icon: 'book' },
                                                                { id: 'idcard', label: 'Kartu Pelajar', icon: 'user' },
                                                            ];

                                                            return ( <
                                                                    div className = "min-h-screen flex flex-col md:flex-row" >
                                                                    <
                                                                    aside className = "w-full md:w-64 bg-blue-900 text-white flex flex-col min-h-screen shadow-xl" >
                                                                    <
                                                                    div className = "p-6 text-center border-b border-blue-800" >
                                                                    <
                                                                    h2 className = "font-bold text-lg" > E - Learning Pancasila < /h2> <
                                                                    /div> <
                                                                    div className = "p-4 flex-1" >
                                                                    <
                                                                    nav className = "space-y-1" > {
                                                                        menus.map(menu => ( <
                                                                            button key = { menu.id }
                                                                            onClick = {
                                                                                () => setActiveMenu(menu.id) }
                                                                            className = { `w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeMenu === menu.id ? 'bg-blue-800 text-white' : 'text-blue-200 hover:bg-blue-800'}` } >
                                                                            <
                                                                            Icon name = { menu.icon }
                                                                            size = { 18 }
                                                                            /> { menu.label } <
                                                                            /button>
                                                                        ))
                                                                    } <
                                                                    /nav> <
                                                                    /div> <
                                                                    div className = "p-4 border-t border-blue-800" >
                                                                    <
                                                                    div className = "flex items-center gap-3 px-4 py-3 bg-blue-950 rounded-lg mb-4" >
                                                                    <
                                                                    div className = "text-left flex-1" >
                                                                    <
                                                                    p className = "text-xs text-blue-300" > Masuk sebagai < /p> <
                                                                    p className = "text-sm font-bold truncate" > { user
                                                                            .name } < /p> <
                                                                    /div> <
                                                                    /div> <
                                                                    button onClick = { onLogout }
                                                                    className = "w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-sm font-bold" >
                                                                    <
                                                                    Icon name = "logout"
                                                                    size = { 16 }
                                                                    /> Keluar <
                                                                    /button> <
                                                                    /div> <
                                                                    /aside> <
                                                                    main className = "flex-1 p-4 md:p-8 overflow-y-auto bg-gray-50" >
                                                                    <
                                                                    header className = "mb-8" >
                                                                    <
                                                                    h1 className = "text-3xl font-extrabold text-gray-800" >
                                                                    { menus.find(m => m.id === activeMenu)?.label } <
                                                                    /h1> <
                                                                    /header> <
                                                                    div className = "animate-fade-in-up" > {
                                                                        activeMenu === 'attendance' && < TeacherAttendance students =
                                                                            { students }
                                                                        setStudents = { setStudents }
                                                                        />} {
                                                                            activeMenu === 'scanner' && < TeacherQRScanner students =
                                                                                { students }
                                                                            setStudents = { setStudents }
                                                                            />} {
                                                                                activeMenu === 'materials' && < Materials isTeacher =
                                                                                    { isTeacher }
                                                                                materials = { materials }
                                                                                setMaterials = { setMaterials }
                                                                                />} {
                                                                                    activeMenu === 'agenda' && < TeacherAgenda agendas =
                                                                                        { agendas }
                                                                                    setAgendas = { setAgendas }
                                                                                    />} {
                                                                                        activeMenu === 'idcard' && < StudentIDCard user =
                                                                                            { user }
                                                                                        students = { students }
                                                                                        />} <
                                                                                        /div> <
                                                                                        /main> <
                                                                                        /div>
                                                                                    );
                                                                                };

                                                                                // ============================================================
                                                                                //  APP
                                                                                // ============================================================
                                                                                function App() {
                                                                                    const [currentUser, setCurrentUser] = useState(null);
                                                                                    return currentUser ? < Dashboard user = { currentUser }
                                                                                    onLogout = {
                                                                                        () => setCurrentUser(null) }
                                                                                    /> : < LoginScreen onLogin = { setCurrentUser }
                                                                                    />;
                                                                                }

                                                                                const root = ReactDOM.createRoot(document.getElementById(
                                                                                'root'));
                                                                                root.render( < App / > );
    </script>
</body>
</html>
