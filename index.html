                                                                        date: new Date().toISOString().split('T')[0],
                                                                        class: className,
                                                                        title,
                                                                        notes
                                                                    }, ...agendas]);
                                                                    setTitle('');
                                                                    setNotes('');
                                                                };

                                                                const deleteAgenda = (id) => {
                                                                    if (window.confirm('Hapus agenda ini?')) {
                                                                        setAgendas(agendas.filter(a => a.id !== id));
                                                                    }
                                                                };

                                                                return ( <
                                                                        div className = "grid grid-cols-1 lg:grid-cols-3 gap-6" >
                                                                        <
                                                                        div className = "bg-white p-6 rounded-xl border col-span-1" >
                                                                        <
                                                                        h2 className = "font-bold mb-4" > Tambah Agenda < /h2> <
                                                                        form onSubmit = { handleAdd }
                                                                        className = "space-y-4" >
                                                                        <
                                                                        select value = { className }
                                                                        onChange = { (e) => setClassName(e.target.value) }
                                                                        className = "w-full p-2 border rounded" >
                                                                        <
                                                                        option > SRD 1 < /option> <
                                                                        option > SRMP 1 < /option> <
                                                                        option > SRMA 1 < /option> <
                                                                        /select> <
                                                                        input type = "text"
                                                                        placeholder = "Topik"
                                                                        value = { title }
                                                                        onChange = { (e) => setTitle(e.target.value) }
                                                                        required className = "w-full p-2 border rounded" />
                                                                        <
                                                                        textarea placeholder = "Catatan..."
                                                                        value = { notes }
                                                                        onChange = { (e) => setNotes(e.target.value) }
                                                                        rows = "3"
                                                                        className = "w-full p-2 border rounded" > < /textarea> <
                                                                        button className = "w-full bg-blue-600 text-white py-2 rounded" >
                                                                        Simpan Agenda <
                                                                        /button> <
                                                                        /form> <
                                                                        /div> <
                                                                        div className = "bg-white p-6 rounded-xl border col-span-2" >
                                                                        <
                                                                        h2 className = "font-bold mb-4" > Riwayat Agenda < /h2> <
                                                                        div className = "space-y-4" > {
                                                                            agendas.map(a => ( <
                                                                                div key = { a.id }
                                                                                className = "p-4 border-l-4 border-blue-500 bg-gray-50 flex justify-between items-start" >
                                                                                <
                                                                                div >
                                                                                <
                                                                                h4 className = "font-bold" > { a
                                                                                        .title } < /h4> <
                                                                                p className = "text-xs text-gray-500 mb-1" >
                                                                                { a.class } • { a.date } < /p> <
                                                                                p className = "text-sm" > { a
                                                                                        .notes } < /p> <
                                                                                /div> <
                                                                                button onClick = {
                                                                                    () => deleteAgenda(a.id) }
                                                                                className = "text-red-400 hover:text-red-600 ml-4" >
                                                                                <
                                                                                Icon name = "trash"
                                                                                size = { 18 }
                                                                                /> <
                                                                                /button> <
                                                                                /div>
                                                                            ))
                                                                        } <
                                                                        /div> <
                                                                        /div> <
                                                                        /div>
                                                                    );
                                                                };

                                                                // ======================== KARTU PELAJAR =====================
                                                                const StudentIDCard = ({ user, students }) => {
                                                                    const studentData = students.find(s => s.nama.toLowerCase() === user
                                                                        .name.toLowerCase()) || {
                                                                        nama: user.name,
                                                                        nisn: '0050000000',
                                                                        kelas: 'SRMA 1',
                                                                        ttl: 'Garut, 01 Jan 2005',
                                                                        alamat: 'Jl. Raya Samarang, Garut',
                                                                        gender: 'L'
                                                                    };
                                                                    // Gunakan API gratis untuk QR
                                                                    const qrUrl =
                                                                        `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(studentData.nisn)}&color=000000&bgcolor=ffffff`;

                                                                    return ( <
                                                                            div className = "flex flex-col md:flex-row justify-center gap-8 py-4" >
                                                                            <
                                                                            div className = "card-srt" >
                                                                            { /* Header */ } <
                                                                            div className = "header" >
                                                                            <
                                                                            div className = "logo-place" >
                                                                            <
                                                                            span className = "dot blue" > < /span> <
                                                                            span className = "dot green" > < /span> <
                                                                            span className = "dot yellow" > < /span> <
                                                                            /div> <
                                                                            div className = "text-red-500" >
                                                                            <
                                                                            Icon name = "book"
                                                                            size = { 28 }
                                                                            /> <
                                                                            /div> <
                                                                            /div>

                                                                            <
                                                                            div className = "title-main" >
                                                                            KEMENTERIAN SOSIAL REPUBLIK INDONESIA <
                                                                            /div> <
                                                                            div className = "sub-title" >
                                                                            Sekolah Rakyat Terintegrasi 39 Garut <
                                                                            /div> <
                                                                            div className = "badge-yellow" >
                                                                            KARTU PELAJAR SISWA <
                                                                            /div>

                                                                            <
                                                                            div className = "info-row" >
                                                                            <
                                                                            div className = "photo-place" >
                                                                            <
                                                                            div className = "w-8 h-8 bg-white rounded-full mb-1" > < /div> <
                                                                            div className = "w-12 h-8 bg-white rounded-t" > < /div> <
                                                                            span className = "text-[8px] mt-1" > FOTO < /span> <
                                                                            /div> <
                                                                            div className = "flex-1 space-y-1" >
                                                                            <
                                                                            div >
                                                                            <
                                                                            span className = "label" > Nama < /span> <
                                                                            div className = "value" > { studentData
                                                                                    .nama } < /div> <
                                                                            /div> <
                                                                            div >
                                                                            <
                                                                            span className = "label" > NISN < /span> <
                                                                            div className = "value" > { studentData
                                                                                    .nisn } < /div> <
                                                                            /div> <
                                                                            div >
                                                                            <
                                                                            span className = "label" > Kelas < /span> <
                                                                            div className = "value" > { studentData
                                                                                    .kelas } < /div> <
                                                                            /div> <
                                                                            /div> <
                                                                            /div>

                                                                            <
                                                                            div className = "qr-place" >
                                                                            <
                                                                            img src = { qrUrl }
                                                                            alt = "QR Code"
                                                                            crossOrigin = "anonymous" />
                                                                            <
                                                                            span className = "label-qr" > Kode QR disini < /span> <
                                                                            /div> <
                                                                            div className = "footer-text" > SRT 39
                                                                            GARUT < /div> <
                                                                            /div> <
                                                                            /div>
                                                                        );
                                                                    };

                                                                    // ======================== DASHBOARD ===========================
                                                                    const Dashboard = ({ user, onLogout }) => {
                                                                        const isTeacher = user.role === 'teacher';
                                                                        const [activeMenu, setActiveMenu] = useState(isTeacher ?
                                                                            'attendance' : 'materials');

                                                                        // Load data dari localStorage
                                                                        const initial = loadData();
                                                                        const [students, setStudentsState] = useState(initial
                                                                            .students);
                                                                        const [materials, setMaterialsState] = useState(initial
                                                                            .materials);
                                                                        const [agendas, setAgendasState] = useState(initial.agendas);

                                                                        // Simpan ke localStorage setiap ada perubahan
                                                                        useEffect(() => {
                                                                            saveData(students, materials, agendas);
                                                                        }, [students, materials, agendas]);

                                                                        const setStudents = (newStudents) => {
                                                                            setStudentsState(newStudents);
                                                                        };
                                                                        const setMaterials = (newMaterials) => {
                                                                            setMaterialsState(newMaterials);
                                                                        };
                                                                        const setAgendas = (newAgendas) => {
                                                                            setAgendasState(newAgendas);
                                                                        };

                                                                        const menus = isTeacher ? [
                                                                            { id: 'attendance', label: 'Kehadiran Murid',
                                                                                icon: 'fileText' },
                                                                            { id: 'scanner', label: 'Scan Presensi',
                                                                                icon: 'qrcode' },
                                                                            { id: 'materials', label: 'Materi Ajar',
                                                                                icon: 'book' },
                                                                            { id: 'agenda', label: 'Agenda Guru',
                                                                                icon: 'calendar' },
                                                                        ] : [
                                                                            { id: 'materials', label: 'Materi Pembelajaran',
                                                                                icon: 'book' },
                                                                            { id: 'idcard', label: 'Kartu Pelajar',
                                                                                icon: 'user' },
                                                                        ];

                                                                        return ( <
                                                                                div className = "min-h-screen flex flex-col md:flex-row" >
                                                                                <
                                                                                aside className = "w-full md:w-64 bg-blue-900 text-white flex flex-col min-h-screen shadow-xl" >
                                                                                <
                                                                                div className = "p-6 text-center border-b border-blue-800" >
                                                                                <
                                                                                h2 className = "font-bold text-lg" >
                                                                                E - Learning Pancasila < /h2> <
                                                                                /div> <
                                                                                div className = "p-4 flex-1" >
                                                                                <
                                                                                nav className = "space-y-1" > {
                                                                                    menus.map(menu => ( <
                                                                                        button key = { menu
                                                                                                .id }
                                                                                        onClick = {
                                                                                            () => setActiveMenu(
                                                                                                menu.id) }
                                                                                        className = { `w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${activeMenu === menu.id ? 'bg-blue-800 text-white' : 'text-blue-200 hover:bg-blue-800'}` } >
                                                                                        <
                                                                                        Icon name = { menu
                                                                                                .icon }
                                                                                        size = { 18 }
                                                                                        /> { menu.label } <
                                                                                        /button>
                                                                                    ))
                                                                                } <
                                                                                /nav> <
                                                                                /div> <
                                                                                div className = "p-4 border-t border-blue-800" >
                                                                                <
                                                                                div className = "flex items-center gap-3 px-4 py-3 bg-blue-950 rounded-lg mb-4" >
                                                                                <
                                                                                div className = "text-left flex-1" >
                                                                                <
                                                                                p className = "text-xs text-blue-300" >
                                                                                Masuk sebagai < /p> <
                                                                                p className = "text-sm font-bold truncate" >
                                                                                { user.name } < /p> <
                                                                                /div> <
                                                                                /div> <
                                                                                button onClick = { onLogout }
                                                                                className = "w-full flex items-center justify-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-sm font-bold" >
                                                                                <
                                                                                Icon name = "logout"
                                                                                size = { 16 }
                                                                                /> Keluar <
                                                                                /button> <
                                                                                /div> <
                                                                                /aside> <
                                                                                main className = "flex-1 p-4 md:p-8 overflow-y-auto bg-gray-50" >
                                                                                <
                                                                                header className = "mb-8" >
                                                                                <
                                                                                h1 className = "text-3xl font-extrabold text-gray-800" >
                                                                                { menus.find(m => m.id ===
                                                                                    activeMenu)?.label } <
                                                                                /h1> <
                                                                                /header> <
                                                                                div className = "animate-fade-in-up" > {
                                                                                    activeMenu === 'attendance' && <
                                                                                    TeacherAttendance students =
                                                                                        { students }
                                                                                    setStudents = { setStudents }
                                                                                    />} {
                                                                                        activeMenu === 'scanner' && <
                                                                                        TeacherQRScanner students =
                                                                                            { students }
                                                                                        setStudents = { setStudents }
                                                                                        />} {
                                                                                            activeMenu === 'materials' && <
                                                                                            Materials isTeacher =
                                                                                                { isTeacher }
                                                                                            materials = { materials }
                                                                                            setMaterials = { setMaterials }
                                                                                            />} {
                                                                                                activeMenu === 'agenda' && <
                                                                                                TeacherAgenda agendas =
                                                                                                    { agendas }
                                                                                                setAgendas = { setAgendas }
                                                                                                />} {
                                                                                                    activeMenu === 'idcard' && <
                                                                                                    StudentIDCard user =
                                                                                                        { user }
                                                                                                    students = { students }
                                                                                                    />} <
                                                                                                    /div> <
                                                                                                    /main> <
                                                                                                    /div>
                                                                                                );
                                                                                            };

                                                                                            // ======================== APP ================================
                                                                                            function App() {
                                                                                                const [currentUser,
                                                                                                    setCurrentUser
                                                                                                ] = useState(null);
                                                                                                return currentUser ? <
                                                                                                    Dashboard user = { currentUser }
                                                                                                onLogout = {
                                                                                                    () => setCurrentUser(
                                                                                                        null) }
                                                                                                /> : < LoginScreen onLogin = { setCurrentUser }
                                                                                                />;
                                                                                            }

                                                                                            const root = ReactDOM.createRoot(document
                                                                                            .getElement('root'));
                                                                                            root.render( < App / > );
    </script>
</body>
</html>
